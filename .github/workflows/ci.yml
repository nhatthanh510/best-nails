# Checks every pull request, and applies new database migrations to production when they reach main.
#
# Production deploys need three repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token, https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    the project ref, e.g. the part after /project/ in the dashboard URL
#   SUPABASE_DB_PASSWORD   the production database password
# and a "production" environment (Settings → Environments), where you can require an approval.
#
# Production is only ever changed forward with `db push`. The one exception is a PR labelled
# "reset-production" (development only): its merge resets and seeds production first.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders: the build and unit tests don't connect to Supabase.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      SUPABASE_SECRET_KEY: sb_secret_ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    name: Migrations, pgTAP, generated types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fresh Postgres with every migration in supabase/migrations applied from scratch, plus the seed.
      # Uses the CLI version pinned in package-lock.json, the same one as on developers' machines.
      - name: Start Postgres and apply all migrations
        run: npx supabase db start
      - name: pgTAP tests
        run: npm run test:db
      - name: lib/database.types.ts matches the migrations
        run: |
          npm run db:types
          git diff --exit-code lib/database.types.ts || {
            echo "::error file=lib/database.types.ts::Out of date. Run 'npm run db:types' and commit the result."
            exit 1
          }

  deploy-migrations:
    name: Apply migrations to production
    needs: [app, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      pull-requests: read # to read the merged PR's labels
    # Never two deploys at once, and never cancel one halfway.
    concurrency:
      group: deploy-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      # Development only: merging a PR labelled "reset-production" wipes production, applies every
      # migration from scratch and runs seed.sql (e.g. after squashing migrations into one file).
      # Never use the label once the shop is live. Every other merge skips this step.
      - name: Reset production if the PR asks for it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The PR this push merged (the one whose merge commit is this commit), and its labels.
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '.[] | select(.merge_commit_sha == env.GITHUB_SHA) | .labels[].name')
          if ! grep -qx reset-production <<<"$labels"; then
            echo "The merged PR isn't labelled reset-production: nothing to reset."
            exit 0
          fi
          echo "Labelled reset-production: resetting production and running seed.sql."
          npx supabase db reset --linked --yes
      - name: Migrations that will be applied
        run: npx supabase db push --dry-run
      - name: Apply them
        run: npx supabase db push
      - run: npx supabase migration list --linked
